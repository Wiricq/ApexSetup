<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — APEXSETUP</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">❄️APEX<span>SETUP</span></a>
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <nav class="nav" id="nav">
        <a href="catalog.html">Каталог</a>
        <a href="contacts.html">Контакти</a>
        <a href="recommendations.html">Рекомендації</a>
        <a href="cart.html" class="cart-link">🛒 Кошик <span class="cart-count" id="cart-count">0</span></a>
        <a href="account.html" class="account-link" id="account-link" title="Увійти в акаунт" aria-label="Акаунт">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <span class="account-label" id="account-label">Акаунт</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="page-title">Каталог товарів</h1>

    <!-- Пошук і фільтри (ховаються, поки немає товарів) -->
    <div id="catalog-tools">
      <input type="text" id="search" class="search" placeholder="Пошук товарів...">
      <div class="filters" id="filters"></div>
    </div>

    <!-- Сітка товарів -->
    <div class="products-grid" id="products"></div>
    <p class="empty" id="empty" hidden>Нічого не знайдено 😕</p>

    <!-- Порожній каталог -->
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">🎮</div>
      <h2>Товарів поки немає</h2>
      <p>Каталог готується. Скоро тут з’являться товари.</p>
      <a href="index.html" class="btn">На головну</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <footer class="footer">© 2026 APEXSETUP. Усі права захищено.</footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
