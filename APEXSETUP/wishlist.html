<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обране — APEXSETUP</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">APEX<span>SETUP</span></a>
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <nav class="nav" id="nav">
        <a href="catalog.html">Каталог</a>
        <a href="dream-setup.html">Сетап мрії</a>
        <a href="contacts.html">Контакти</a>
        <a href="cart.html" class="cart-link">🛒 Кошик <span class="cart-count" id="cart-count">0</span></a>
        <a href="account.html" class="account-link" id="account-link" title="Увійти в акаунт" aria-label="Акаунт">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <span class="account-label" id="account-label">Акаунт</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="page-title">❤️ Обране</h1>

    <!-- Панель над списком (ховається, коли обране порожнє) -->
    <div class="wish-toolbar" id="wish-toolbar" hidden>
      <span id="wish-summary"></span>
      <button type="button" class="btn btn-sm btn-outline" id="wish-clear">Очистити обране</button>
    </div>

    <!-- Улюблені товари -->
    <div class="products-grid" id="wish-products"></div>

    <!-- Обране порожнє -->
    <div class="empty-state" id="wish-empty" hidden>
      <div class="empty-icon">🤍</div>
      <h2>В обраному поки порожньо</h2>
      <p>Натисніть на сердечко на картці товару, щоб зберегти його тут.</p>
      <a href="catalog.html" class="btn">Перейти до каталогу</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <footer class="footer">© 2026 APEXSETUP. Усі права захищено.</footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist-page.js"></script>
</body>
</html>
